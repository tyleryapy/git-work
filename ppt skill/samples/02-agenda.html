<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>02-agenda — sketch2deck</title>
  <style>
    :root {
      --text: #000000;
      --muted: #808080;
      --bg: #FFFFFF;
      --bg2: #B1B1B0;
      --accent1: #0092F4;
      --accent2: #20DC86;
      --accent3: #DFD902;
      --accent4: #F7931E;
      --accent5: #FF4800;
      --accent6: #DA54D8;
      --border: #E3E3E3;
      --highlight: #FFE832;
      --hyperlink: #0563C1;
      --midnight: #002373;
      --dark-panel: #1E1E28;
      --tint-blue-mid: #5FBFFF;
      --tint-blue-light: #95D4FF;
      --tint-green-mid: #78EBB7;
      --tint-green-light: #A5F2CF;
      --tint-coral: #FF9166;
      --tint-coral-mid: #FFB699;
      --tint-coral-light: #FBC7B2;
      --font: "Avenir Next LT Pro", "Avenir Next", "Segoe UI", Arial, system-ui, sans-serif;
      --slide-w: 1920px;
      --slide-h: 1080px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: #E8ECF0;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 24px 16px 48px;
    }

    .export-bar {
      width: min(100%, var(--slide-w));
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: #444;
    }

    .export-bar strong { color: var(--accent1); }

    .export-bar button {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .export-bar button.primary {
      background: var(--accent1);
      border-color: var(--accent1);
      color: #fff;
    }

    /* === Capture only this node (16:9) — margins match Standard grid === */
    .slide {
      width: var(--slide-w);
      height: var(--slide-h);
      background: var(--bg);
      color: var(--text);
      position: relative;
      overflow: hidden;
      padding: 54px 106px 72px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      flex-shrink: 0;
    }

    .slide .title {
      font-size: 86px;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 28px;
      max-width: 95%;
    }

    .slide .section-header,
    .slide .subject {
      font-size: 53px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 20px;
      max-width: 95%;
    }

    .slide .tagline {
      font-size: 40px;
      font-weight: 400;
      line-height: 1.3;
      margin: -8px 0 36px;
      max-width: 90%;
    }

    .slide .body {
      font-size: 53px;
      font-weight: 400;
      line-height: 1.35;
    }

    .slide .caption {
      font-size: 24px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 12px;
    }

    .slide .bullets {
      list-style: none;
      font-size: 53px;
      line-height: 1.35;
    }

    .slide .bullets > li {
      position: relative;
      padding-left: 1.1em;
      margin-bottom: 0.45em;
    }

    .slide .bullets > li::before {
      content: "•";
      position: absolute;
      left: 0;
    }

    .slide .bullets ul {
      list-style: none;
      margin-top: 0.35em;
      font-size: 40px;
    }

    .slide .bullets ul > li {
      position: relative;
      padding-left: 1.2em;
      margin-bottom: 0.4em;
    }

    .slide .bullets ul > li::before {
      content: "–";
      position: absolute;
      left: 0;
    }

    .slide .bullets ul ul {
      font-size: 32px;
    }

    .slide .bullets ul ul > li::before {
      content: ">";
    }

    .columns {
      display: grid;
      gap: 48px;
      margin-top: 12px;
    }

    .columns.cols-2 { grid-template-columns: 1fr 1fr; }
    .columns.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .columns.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .col h3,
    .icon-card h3 {
      font-size: 40px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--accent1);
    }

    .col .bullets { font-size: 40px; }

    .icon-cards {
      display: grid;
      gap: 36px;
      margin-top: 12px;
    }

    .icon-cards.cols-2 { grid-template-columns: 1fr 1fr; }
    .icon-cards.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
    .icon-cards.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }

    .icon-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 280px;
    }

    .icon-card .icon {
      width: 64px;
      height: 64px;
      border: 3px solid var(--accent1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent1);
      font-size: 32px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .icon-card p {
      font-size: 32px;
      line-height: 1.35;
    }

    .image-block {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 100%;
    }

    .image-block .photo {
      width: 100%;
      max-height: 620px;
      object-fit: cover;
      background: #F3F5F7;
      border: 1px solid var(--border);
    }

    .image-block .photo.placeholder {
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 32px;
    }

    table.data,
    table.agenda {
      width: 100%;
      border-collapse: collapse;
      font-size: 27px;
      margin-top: 12px;
    }

    table.data th,
    table.agenda th,
    .table-header {
      text-align: left;
      font-size: 32px;
      font-weight: 700;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border);
    }

    table.data td,
    table.agenda td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    table.data tr:nth-child(even) td {
      background: rgba(177, 177, 176, 0.08);
    }

    .status-pos { color: var(--accent2); font-weight: 600; }
    .status-warn { color: var(--accent3); font-weight: 600; }
    .status-neg { color: var(--accent5); font-weight: 600; }

    .quote-block {
      position: relative;
      padding: 24px 80px 24px 0;
      margin-top: 24px;
    }

    .quote-block .marks-open,
    .quote-block .marks-close {
      position: absolute;
      font-size: 96px;
      line-height: 1;
      color: var(--accent1);
      opacity: 0.85;
    }

    .quote-block .marks-open { top: 0; right: 0; }
    .quote-block .marks-close { bottom: 40px; right: 0; }

    .quote-block .quote-text {
      font-size: 64px;
      font-weight: 600;
      line-height: 1.25;
      max-width: 92%;
    }

    .quote-block .attribution {
      margin-top: 36px;
      font-size: 40px;
      font-weight: 600;
      color: var(--muted);
    }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 48px;
      height: 420px;
      margin: 24px 48px 0;
      border-bottom: 3px solid #000;
      padding-bottom: 0;
    }

    .chart .bar-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      gap: 12px;
    }

    .chart .bar {
      width: 100%;
      max-width: 120px;
      background: var(--accent1);
      border-radius: 2px 2px 0 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10px;
      color: #fff;
      font-size: 28px;
      font-weight: 600;
    }

    .chart .bar.baseline { background: var(--bg2); }
    .chart .bar.pos { background: var(--accent2); }
    .chart .bar.neg { background: var(--accent5); }

    .chart .cat,
    .chart-axis {
      font-size: 29px;
      color: #666;
      text-align: center;
    }

    .chart-label {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
    }

    .waterfall {
      display: flex;
      align-items: flex-end;
      gap: 32px;
      height: 420px;
      margin: 24px 48px 0;
      border-bottom: 3px solid #000;
      position: relative;
    }

    .process {
      display: flex;
      align-items: stretch;
      gap: 24px;
      margin-top: 24px;
    }

    .process .step {
      flex: 1;
      border: 3px solid var(--accent1);
      border-radius: 12px;
      padding: 24px;
      background: var(--tint-blue-light);
    }

    .process .step h3 {
      font-size: 40px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }

    .process .step p {
      font-size: 32px;
      line-height: 1.3;
    }

    .process .arrow {
      align-self: center;
      color: var(--accent1);
      font-size: 48px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .footnote {
      position: absolute;
      left: 106px;
      bottom: 40px;
      font-size: 21px;
      color: var(--muted);
      max-width: 70%;
    }

    .slide-num {
      position: absolute;
      right: 106px;
      bottom: 40px;
      font-size: 27px;
      color: var(--muted);
    }

    a { color: var(--hyperlink); }

    @media print {
      body {
        background: #fff;
        padding: 0;
        gap: 0;
      }
      .export-bar { display: none !important; }
      .slide {
        box-shadow: none;
        margin: 0;
        page-break-after: always;
      }
      @page {
        size: 1920px 1080px;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="export-bar">
    <div>
      <strong>sketch2deck</strong> — screenshot the white slide only, or Print → Save as PDF (background graphics on).
    </div>
    <div>
      <button type="button" class="primary" onclick="window.print()">Print / PDF</button>
    </div>
  </div>

  <!-- Replace inner content per layout. Keep .slide dimensions unchanged. -->
  <div class="slide" data-layout="Big title and Content - Light">
    <h1 class="title">Agenda</h1>
    <table class="agenda">
      <thead>
        <tr><th>#</th><th>Agenda Item</th><th>Owner</th></tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>Context and market setup</td><td>Strategy</td></tr>
        <tr><td>2</td><td>Performance snapshot</td><td>Analytics</td></tr>
        <tr><td>3</td><td>Recommendations</td><td>RevOps</td></tr>
      </tbody>
    </table>
    <div class="footnote">* Sample agenda layout</div>
    <div class="slide-num">2</div>
  </div>
</body>
</html>
